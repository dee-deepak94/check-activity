<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Activity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="main-section">
        <div class="google-check">
            <div class="sign-in">
                <img src="./assets/image.png" alt="Google-Logo">
                <p>A new sign-in on Mac</p>
                <div class="email-id">
                    <img src="./assets/deepak.jpg" alt="">
                    <a href="#">dee.deepak94@gmail.com</a>
                </div>
            </div>
            <hr>
    
            <div class="check-activity">
                <p>We noticed a new sign-in to your Google Account on a Mac device. If this was you, you don't need to do anything. If not, we'll help you secure your  account.</p>
                <button>Check activity</button>
                <p>You can alo see security activity at</p>
                <a href="#">https://myaccount.google.com/notifications</a>
            </div>
        </div>
        
    </section>
</body>
</html>
